<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 边框发光渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <!-- 顶面活墙渐变 -->
    <linearGradient id="wallTopGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wallTopGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- 立面阴影渐变 -->
    <linearGradient id="wallLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="wallRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- 霓虹光轨发光滤波 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 核心能量球辐射 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. 外框科技圆角底盘 -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- 2. 背景微弱全息坐标网格 -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <line x1="80" y1="40" x2="80" y2="472" />
    <line x1="168" y1="40" x2="168" y2="472" />
    <line x1="256" y1="40" x2="256" y2="472" />
    <line x1="344" y1="40" x2="344" y2="472" />
    <line x1="432" y1="40" x2="432" y2="472" />
    <line x1="40" y1="80" x2="472" y2="80" />
    <line x1="40" y1="168" x2="472" y2="168" />
    <line x1="40" y1="256" x2="472" y2="256" />
    <line x1="40" y1="344" x2="472" y2="344" />
    <line x1="40" y1="432" x2="472" y2="432" />
  </g>

  <!-- 四角科技刻度标记 -->
  <path d="M52 76 V52 H76 M460 76 V52 H436 M52 436 V460 H76 M460 436 V460 H436" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- 3. 等轴测 3D 动力学迷宫立方群组 (Isometric Matrix) -->
  <g transform="translate(256, 268)">
    <!-- 迷宫基底阴影 -->
    <ellipse cx="0" cy="90" rx="160" ry="70" fill="#000000" opacity="0.6" filter="url(#neonGlow)" />

    <!-- A. 后侧立柱 (Z-Back) -->
    <!-- 柱 1: 后左高墙 -->
    <g transform="translate(-70, -110)">
      <!-- 左侧面 -->
      <polygon points="0,0 -40,23 -40,83 0,60" fill="url(#wallLeftGrad)" stroke="#1e293b" stroke-width="1.5" />
      <!-- 右侧面 -->
      <polygon points="0,0 40,23 40,83 0,60" fill="url(#wallRightGrad)" stroke="#1e293b" stroke-width="1.5" />
      <!-- 顶面 -->
      <polygon points="0,-46 -40,-23 0,0 40,-23" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <!-- 顶面霓虹中轴灯带 -->
      <line x1="-30" y1="-17" x2="30" y2="-17" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
    </g>

    <!-- 柱 2: 后右高墙 (终点信标所在柱) -->
    <g transform="translate(70, -110)">
      <polygon points="0,0 -40,23 -40,95 0,72" fill="url(#wallLeftGrad)" stroke="#1e293b" stroke-width="1.5" />
      <polygon points="0,0 40,23 40,95 0,72" fill="url(#wallRightGrad)" stroke="#1e293b" stroke-width="1.5" />
      <polygon points="0,-58 -40,-35 0,-12 40,-35" fill="#2d1b4e" stroke="#e879f9" stroke-width="2" />
      <!-- 终点粉色能量光柱 -->
      <circle cx="0" cy="-35" r="22" fill="url(#beaconGlow)" filter="url(#neonGlow)" />
      <circle cx="0" cy="-35" r="7" fill="#ffffff" />
    </g>

    <!-- B. 中间回转迷宫折墙 (Kinetic Isometric Walls) -->
    <!-- 外围回环大折墙: 从左侧弯折到前方 -->
    <!-- 左翼主墙 -->
    <g transform="translate(-105, -20)">
      <polygon points="0,0 -45,26 -45,100 0,74" fill="url(#wallLeftGrad)" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1.5" />
      <polygon points="0,0 45,26 45,100 0,74" fill="url(#wallRightGrad)" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1.5" />
      <polygon points="0,-60 -45,-34 0,-8 45,-34" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <!-- 墙顶青蓝能量光轨 -->
      <path d="M-32,-27 L0,-8 L32,-27" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
    </g>

    <!-- 右翼主墙 -->
    <g transform="translate(105, -20)">
      <polygon points="0,0 -45,26 -45,100 0,74" fill="url(#wallLeftGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
      <polygon points="0,0 45,26 45,100 0,74" fill="url(#wallRightGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
      <polygon points="0,-60 -45,-34 0,-8 45,-34" fill="#1e163b" stroke="#c084fc" stroke-width="2.5" />
      <!-- 墙顶极光紫光轨 -->
      <path d="M-32,-27 L0,-8 L32,-27" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
    </g>

    <!-- C. 前景低落通道与活墙阶梯 (Front Kinetic Shift) -->
    <g transform="translate(0, 55)">
      <!-- 前端中岛立柱 -->
      <polygon points="0,0 -50,29 -50,70 0,41" fill="url(#wallLeftGrad)" stroke="#1e293b" stroke-width="1.5" />
      <polygon points="0,0 50,29 50,70 0,41" fill="url(#wallRightGrad)" stroke="#1e293b" stroke-width="1.5" />
      <polygon points="0,-48 -50,-19 0,10 50,-19" fill="#0b1329" stroke="#38bdf8" stroke-width="2.5" />
      <path d="M-36,-14 L0,7 L36,-14" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- D. 中心悬浮聚变核心 (Player Energy Core) —— 视线绝对焦点 -->
    <g transform="translate(0, -32)">
      <!-- 底部扩散全息光环 -->
      <ellipse cx="0" cy="38" rx="42" ry="20" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.6" filter="url(#neonGlow)" />
      <ellipse cx="0" cy="38" rx="25" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.8" />

      <!-- 中心等离子小球 -->
      <circle cx="0" cy="0" r="32" fill="url(#coreGlow)" filter="url(#neonGlow)" />
      <circle cx="0" cy="0" r="14" fill="#ffffff" />
      <!-- 球体高光与晶体切线 -->
      <circle cx="-5" cy="-6" r="6" fill="#ffffff" opacity="0.85" />

      <!-- 环绕轨道粒子环 (Orbit Kinetic Ring) -->
      <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="16 12" transform="rotate(-22)" opacity="0.85" filter="url(#neonGlow)" />
    </g>

    <!-- E. 贯穿迷宫的 A* 最优寻路金光折线 (Solving Synapse) -->
    <path d="M-105,-46 L-45,-12 L0,-32 L45,-52 L70,-145" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" opacity="0.9" filter="url(#neonGlow)" />
  </g>

  <!-- 4. 底部科技铭文徽章 -->
  <g transform="translate(256, 436)" text-anchor="middle">
    <text font-family="'Outfit Variable', 'PingFang SC', sans-serif" font-size="20" font-weight="800" letter-spacing="8" fill="#e2e8f0">
      CYBERMAZE
    </text>
    <text y="22" font-family="'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="4" fill="#38bdf8" opacity="0.9">
      3D // KINETIC LABYRINTH
    </text>
  </g>
</svg>
